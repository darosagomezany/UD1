<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Validación de usuario</title>
</head>
<body>
  <h1>Validación de usuario</h1>
  <form action="servicio.php" method="get">
    <p>
      <label for="usuario">Nombre de usuario:</label>
      <input type="text" id="usuario" name="usuario" maxlength="10" size="12">
    </p>
    <p>
      <label for="clave">Contraseña:</label>
      <input type="password" id="clave" name="clave" maxlength="12" size="14">
    </p>
    <p>
      <input type="submit" value="Enviar">
      <input type="reset" value="Borrar">
    </p>
  </form>
</body>
</html>
